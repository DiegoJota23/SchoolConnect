<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolConnect - Iniciar sesión</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo.png" alt="SchoolConnect Logo">
      <h1>SchoolConnect</h1>
    </div>
  </header>

  <main>
    <section class="login-container">
      <h2>Iniciar sesión</h2>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Correo institucional</label>
          <input type="email" id="email" name="email" placeholder="usuario@schoolconnect.edu" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="********" required>
        </div>

        <button type="submit" class="btn">Iniciar sesión</button>

        <p class="links">
          <a href="recuperar.html">¿Olvidaste tu contraseña?</a><br>
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>

        <p id="error-message" class="error-message"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 SchoolConnect. Todos los derechos reservados.</p>
  </footer>

  <script src="login.js"></script>
</body>
</html>
